openapi: 3.0.3
info:
  title: Order Management Service
  version: 1.0.0
  description: |
    Microservice for placing, tracking, and cancelling customer orders.
    Supports order creation, status transitions, line-item retrieval,
    and search with pagination.
  contact:
    name: Order Platform Team
    email: orders@example.com

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

security: []
# Explicitly marks this API as public (no authentication required)

tags:
  - name: Orders
    description: Operations on customer orders

paths:
  /orders:
    get:
      tags: [Orders]
      summary: List all orders
      description: Returns a paginated list of orders, optionally filtered by status or customer. Supports standard pagination parameters (page, size).
      operationId: listOrders
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
          description: Filter by the customer who placed the order
        - name: status
          in: query
          schema:
            type: string
            enum: [PLACED, CONFIRMED, PACKED, SHIPPED, DELIVERED, CANCELLED]
          description: Filter by current order status
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Orders]
      summary: Place a new order
      description: Creates a new order from a set of line items. The `orderNumber` is generated by the server and is unique. Stock is reserved on success.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Order could not be placed (e.g., insufficient stock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      description: Retrieves the full details of a single order, including its line items and delivery address.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique order identifier (UUID)
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Orders]
      summary: Update an existing order
      description: Updates the delivery address or notes of an order. Line items cannot be changed once the order has been confirmed.
      operationId: updateOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique order identifier (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Orders]
      summary: Cancel an order
      description: Cancels the order and releases any reserved stock. Orders that have already shipped cannot be cancelled.
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique order identifier (UUID)
      responses:
        "204":
          description: Order cancelled successfully (no content returned)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order can no longer be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    Order:
      type: object
      required:
        - id
        - orderNumber
        - customerId
        - status
        - totalAmount
      properties:
        id:
          type: string
          description: Unique order ID (UUID)
          example: "d4c3b2a1"
        orderNumber:
          type: string
          description: Human readable order number (unique)
          example: "ORD-2026-0001"
        customerId:
          type: string
          example: "cust-88213"
        status:
          type: string
          enum: [PLACED, CONFIRMED, PACKED, SHIPPED, DELIVERED, CANCELLED]
          example: "CONFIRMED"
        currency:
          type: string
          example: "USD"
        totalAmount:
          type: number
          format: double
          example: 149.97
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: "123 Main Street, New York, NY 10001"
        notes:
          type: string
          example: "Leave at the front desk"
        placedAt:
          type: string
          format: date-time
          example: "2026-08-12T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-12T10:00:00Z"

    OrderItem:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
          example: "SKU-12345"
        productName:
          type: string
          example: "Wireless Mouse"
        quantity:
          type: integer
          minimum: 1
          example: 3
        unitPrice:
          type: number
          format: double
          example: 49.99

    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
        - deliveryAddress
      properties:
        customerId:
          type: string
          example: "cust-88213"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: "123 Main Street, New York, NY 10001"
        notes:
          type: string
          example: "Leave at the front desk"
        currency:
          type: string
          default: "USD"
          example: "USD"

    UpdateOrderRequest:
      type: object
      properties:
        deliveryAddress:
          type: string
          example: "456 Park Avenue, New York, NY 10022"
        notes:
          type: string
          example: "Ring the doorbell twice"

    OrderListResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 87
        totalPages:
          type: integer
          example: 5
        content:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        errorCode:
          type: string
          example: "INVALID_ORDER"
        message:
          type: string
          example: "Validation failed: items must not be empty"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-12T10:00:00Z"
        path:
          type: string
          example: "/v1/orders"

  responses:
    BadRequest:
      description: Invalid request - the server could not understand the payload or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error - something went wrong on the server side.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
